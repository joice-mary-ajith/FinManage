<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FinManage logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FinManage</title>
  <rect width="64" height="64" rx="16" fill="#0f3d3a"/>
  <!-- the letter F is built from budget progress bars -->
  <rect x="14" y="11" width="11" height="42" rx="5.5" fill="#f4efe0"/>
  <rect x="14" y="11" width="36" height="11" rx="5.5" fill="#e0a526"/>
  <rect x="14" y="27" width="25" height="11" rx="5.5" fill="#9fd0c7"/>
  <!-- the coin, doubling as the full stop in "F." -->
  <circle cx="43.5" cy="46.5" r="7.5" fill="#e0a526"/>
  <circle cx="43.5" cy="46.5" r="3.4" fill="none" stroke="#0f3d3a" stroke-width="2"/>
</svg>
